<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photoshop Certification Quiz - Part 2</title>
<style>
*{box-sizing:border-box}body{font:17px Arial,sans-serif;background:#eef3f8;color:#17304c;margin:0;padding:20px}.app{max-width:800px;margin:auto;background:white;border-radius:16px;padding:28px;box-shadow:0 5px 24px #1a385622}h1{color:#075c9d;font-size:27px}.muted{color:#596d80}.choice{display:block;border:1px solid #c7d7e5;padding:14px;border-radius:9px;margin:10px 0;cursor:pointer}.choice:has(input:checked){background:#e0f2ff;border-color:#007acc}input{margin-right:12px}button{background:#0076c8;color:white;border:0;border-radius:8px;padding:12px 19px;font-size:16px;cursor:pointer;margin:5px}button:disabled{opacity:.45;cursor:not-allowed}.bar{height:9px;background:#dce5ed;border-radius:10px;overflow:hidden}.fill{height:100%;background:#0782d0}.result{padding:14px 0;border-bottom:1px solid #ddd}.right{color:#087d4d}.wrong{color:#ba3540}.alert{background:#fff4d8;border:1px solid #dfb65e;padding:12px;border-radius:8px;margin:12px 0}.nav{display:flex;flex-wrap:wrap;gap:5px}@media print{button{display:none}.app{box-shadow:none}}
</style></head><body><main class="app"><h1>Adobe Photoshop Certification Quiz — Part 2</h1><p class="muted">23 questions • Select the number of answers indicated • View your score after submission.</p><div id="quiz"></div></main>
<script>
const questions=[{"q": "What defines form in a two-dimensional image?", "options": ["Texture and shape", "Contrast and tone", "Lines and texture", "Light and shadow"], "correct": [3]}, {"q": "Which basic design element is primarily made up of lines?", "options": ["Shape", "Texture", "Contrast", "Form", "Color theory"], "correct": [0]}, {"q": "When pasting content from another application into Photoshop, which Paste As options are available? Choose three.", "options": ["Pixels", "Vector", "Smart Object", "Paths", "SVG", "Mask"], "correct": [0, 2, 3]}, {"q": "Which are types of gradients available in Photoshop? Choose three.", "options": ["Angle", "Linear", "Symmetrical", "Rounded", "Diamond"], "correct": [0, 1, 4]}, {"q": "Which commercial color library is widely used in graphic design and printing?", "options": ["PANTONE", "HSK", "Epson", "DCIM"], "correct": [0]}, {"q": "Which gradient control defines where the transition between two colors is balanced?", "options": ["Noise", "Color wheel", "Opacity stop", "Color midpoint"], "correct": [3]}, {"q": "Which two methods can display the Brushes panel?", "options": ["Window > Workspace > Painting", "Window > Brushes", "Select Brush tool (B) only", "Select Brush Preset in Properties", "Select Brush icon in Layers", "Select History Brush (Y)"], "correct": [0, 1]}, {"q": "Which keyboard shortcut activates Free Transform for scaling an embedded Smart Object on Windows?", "options": ["Ctrl+T", "Ctrl+B", "Ctrl+A", "Ctrl+S"], "correct": [0]}, {"q": "In Free Transform mode, which control bends or warps an object?", "options": ["Commit transform checkmark", "Warp icon in Options bar", "Cancel transform", "Lock proportions"], "correct": [1]}, {"q": "How do you swap width and height while using the Crop tool?", "options": ["Select the Crop tool, click the swap arrows in the Options bar, then confirm", "Use the Eraser tool and press Enter", "Choose Filter > Blur", "Press Ctrl+S to swap values"], "correct": [0]}, {"q": "Which tool makes drawing curved vector paths easier?", "options": ["Delete Anchor Point tool", "Perspective Crop tool", "Curvature Pen tool", "Color Replacement tool"], "correct": [2]}, {"q": "Which eraser tool removes similarly colored pixels when clicked?", "options": ["Eraser Tool", "Background Eraser Tool", "Magic Eraser Tool", "History Brush Tool"], "correct": [2]}, {"q": "What is the color balance setting on a digital camera called?", "options": ["Rule of thirds", "Frame balance", "Depth of field", "White balance"], "correct": [3]}, {"q": "Which design principle describes placing related elements close to one another?", "options": ["Framing", "Cropping", "Resampling", "Rule of thirds", "Proximity"], "correct": [4]}, {"q": "Which principle uses consistent recurring elements to establish a visual pattern or theme?", "options": ["Rhythm", "Focal point", "Emphasis", "Unity"], "correct": [0]}, {"q": "Which term describes the space between lines of type?", "options": ["Kerning", "Tracking", "Leading", "Type Style"], "correct": [2]}, {"q": "Which term describes the space between two specific characters?", "options": ["Leading", "Kerning", "Tracking", "Type Style"], "correct": [1]}, {"q": "Which term describes spacing across a range of characters?", "options": ["Leading", "Kerning", "Tracking", "Type Style"], "correct": [2]}, {"q": "Which are types of lines? Choose three.", "options": ["Straight", "Textured", "Rectilinear", "Contrasting", "Curvilinear"], "correct": [0, 2, 4]}, {"q": "Which composition guideline divides an image using two horizontal and two vertical lines?", "options": ["Framing", "Field of view", "Focal point", "Space", "Rule of thirds"], "correct": [4]}, {"q": "Which design principle refers to the justification or positioning of objects or text?", "options": ["Alignment", "Repetition", "Balance", "Harmony", "White space"], "correct": [0]}, {"q": "Which colors are located opposite each other on the color wheel?", "options": ["Analogous", "Harmonious", "Complementary", "Contrasting"], "correct": [2]}, {"q": "Which term describes a variation of a typeface such as bold, italic, or regular?", "options": ["Tracking", "Leading", "Type Style", "Kerning"], "correct": [2]}];
let index=0;let answers=questions.map(()=>[]);const root=document.getElementById('quiz');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function complete(i){return answers[i].length===questions[i].correct.length}
function render(){const q=questions[index],picked=answers[index],multi=q.correct.length>1;const count=questions.filter((_,i)=>complete(i)).length;
root.innerHTML=`<p><b>Question ${index+1} of ${questions.length}</b> · ${count} fully answered</p><div class="bar"><div class="fill" style="width:${100*count/questions.length}%"></div></div><h2>${esc(q.q)}</h2><p class="muted">${multi?'Select exactly '+q.correct.length+' answers.':'Select one answer.'}</p>${q.options.map((o,j)=>`<label class="choice"><input type="${multi?'checkbox':'radio'}" name="answer" value="${j}" ${picked.includes(j)?'checked':''}>${String.fromCharCode(65+j)}. ${esc(o)}</label>`).join('')}<div id="warning" role="alert"></div><div class="nav"><button id="prev" ${index===0?'disabled':''}>Previous</button><button id="next">${index===questions.length-1?'Submit Quiz':'Next'}</button></div>`;
root.querySelectorAll('input').forEach(el=>el.addEventListener('change',()=>{let a=Array.from(root.querySelectorAll('input:checked')).map(x=>Number(x.value));answers[index]=a;render()}));
document.getElementById('prev').onclick=()=>{if(index>0){index--;render()}};
document.getElementById('next').onclick=()=>{if(index<questions.length-1){index++;render()}else{const missing=questions.map((_,i)=>!complete(i)?i+1:null).filter(Boolean);if(missing.length){document.getElementById('warning').innerHTML=`<div class="alert">Please complete the required number of selections for question(s): <b>${missing.join(', ')}</b>. <button id="jump">Go to question ${missing[0]}</button></div>`;document.getElementById('jump').onclick=()=>{index=missing[0]-1;render()};return}results()}}}
function results(){let score=0;const lines=questions.map((q,i)=>{const a=answers[i];const ok=a.length===q.correct.length&&q.correct.every(x=>a.includes(x));if(ok)score++;return `<div class="result"><b class="${ok?'right':'wrong'}">${i+1}. ${ok?'✓':'✗'} ${esc(q.q)}</b><p>Your answer: ${a.map(x=>esc(q.options[x])).join(', ')||'None'}</p><p class="right">Correct answer: ${q.correct.map(x=>esc(q.options[x])).join(', ')}</p></div>`}).join('');root.innerHTML=`<h2>Your score: ${score}/${questions.length} (${Math.round(score/questions.length*100)}%)</h2><button id="retake">Retake Quiz</button><button id="print">Print Results</button>${lines}`;document.getElementById('retake').onclick=()=>{index=0;answers=questions.map(()=>[]);render()};document.getElementById('print').onclick=()=>window.print();window.scrollTo(0,0)}
render();
</script></body></html>
